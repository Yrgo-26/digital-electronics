# Set pipeline name.
name: Book

# Build and publish the book whenever a tag named v* is pushed, e.g. v1.0.0.
on:
  push:
    tags: ["v*"]

# Creating a release needs write access to the repository's contents.
permissions:
  contents: write

defaults:
  run:
    shell: bash

# Define pipeline jobs.
jobs:
  # Build the PDF with the tag on its title page, and attach it to a release named after the tag.
  release:
    name: Build and release the book
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      # texlive-lang-european carries the Swedish hyphenation patterns.
      - name: Install LuaLaTeX and fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y make texlive-luatex texlive-latex-extra texlive-lang-european \
                                  fonts-texgyre fonts-texgyre-math fonts-dejavu-core

      # The figures are drawn by diagrams/, in the environment `make diagrams` uses, with the
      # pinned versions in diagrams/requirements.txt.
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: diagrams/requirements.txt

      - name: Install the pinned drawing dependencies
        run: |
          python -m venv .venv
          .venv/bin/pip install -r diagrams/requirements.txt

      - name: Build
        run: make -C book VERSION="${{ github.ref_name }}"

      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" book/digitalteknik.pdf \
            --title "Digitalteknik, ${{ github.ref_name }}" \
            --notes "Kursen satt som bok, byggd från ${{ github.sha }}."
